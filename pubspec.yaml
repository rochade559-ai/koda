name: koda
description: Kodaff Investimentos - Smart Money
publish_to: 'none'
version: 1.0.0+12

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # UI / Utilitários
  cupertino_icons: ^1.0.8
  http: ^1.2.2
  mask_text_input_formatter: ^2.9.0
  intl: ^0.19.0
  shared_preferences: ^2.3.2
  file_picker: ^8.1.2
  url_launcher: ^6.3.1

  # Firebase
  firebase_core: ^3.6.0
  firebase_auth: ^5.3.1
  cloud_firestore: ^5.4.4
  firebase_storage: ^12.3.2
  firebase_app_check: ^0.3.2+10
  cloud_functions: ^5.1.3

  # Login com Google
  google_sign_in: ^6.2.1

  # Ícones e splash
  flutter_launcher_icons: ^0.14.1
  flutter_native_splash: ^2.4.3
  sign_in_with_apple: ^8.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/icons/

# ============================================================
# ÍCONE DO APP
# ============================================================
flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/icons/app_icon.png"
  min_sdk_android: 21
  adaptive_icon_background: "#0F172A"
  adaptive_icon_foreground: "assets/icons/app_icon.png"
  remove_alpha_ios: true

# ============================================================
# SPLASH NATIVA
# ============================================================
flutter_native_splash:
  color: "#0F172A"
  color_dark: "#0F172A"
  image: "assets/icons/splash_logo.png"
  image_dark: "assets/icons/splash_logo.png"
  android: true
  ios: true
  web: false
  fullscreen: true
  android_12:
    image: "assets/icons/splash_logo.png"
    icon_background_color: "#0F172A"
    color: "#0F172A"