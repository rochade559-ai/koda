<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <base href="$FLUTTER_BASE_HREF">
  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Kodaff — Investimentos Smart Money">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  
  <!-- Meta tags de App -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Kodaff">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">
  <link rel="icon" type="image/png" href="favicon.png"/>
  
  <title>Kodaff — Investimentos Smart Money</title>
  
  <!-- 👇 ADICIONADO AQUI PARA O LOGIN COM GOOGLE FUNCIONAR NA WEB 👇 -->
  <meta name="google-signin-client_id" content="595685952877-5gvo1ca823vr8tqjbgs3sjdvp2tlc9if.apps.googleusercontent.com">

  <link rel="manifest" href="manifest.json">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #0F172A; overflow: hidden; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }

    #loading-kodaff {
      position: fixed; inset: 0; z-index: 9999;
      background: radial-gradient(circle at 50% 40%, #1E3A5F 0%, #0F172A 65%);
      display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 40px;
      transition: opacity .5s ease;
    }
    #loading-kodaff.ocultar { opacity: 0; pointer-events: none; }

    .kd-loader { position: relative; width: 220px; height: 220px; display: flex; align-items: center; justify-content: center; }
    .kd-ring { position: absolute; inset: 0; border-radius: 50%; border: 2px solid transparent;
      border-top-color: #00E5FF; border-right-color: rgba(0,229,255,.3);
      filter: drop-shadow(0 0 6px #00E5FF); animation: kd-spin 1.6s linear infinite; }
    .kd-ring-2 { position: absolute; inset: 16px; border-radius: 50%; border: 1px dashed rgba(251,191,36,.5);
      animation: kd-spin 6s linear infinite reverse; }
    .kd-glow { position: absolute; inset: 40px; border-radius: 50%;
      background: radial-gradient(circle, rgba(0,229,255,.25), transparent 70%); animation: kd-pulse 2s ease-in-out infinite; }

    .kd-finger { position: relative; width: 128px; height: 128px; }
    .kd-finger svg { width: 100%; height: 100%; stroke: #00E5FF; stroke-width: 1.2; fill: none;
      stroke-linecap: round; stroke-linejoin: round;
      filter: drop-shadow(0 0 8px rgba(0,229,255,.7)); animation: kd-pulse 2s ease-in-out infinite; }
    .kd-scan { position: absolute; left: 5%; width: 90%; height: 2px; border-radius: 2px;
      background: linear-gradient(90deg, transparent, #FBBF24, transparent);
      box-shadow: 0 0 14px #FBBF24, 0 0 28px rgba(251,191,36,.5); animation: kd-scan 1.8s ease-in-out infinite; }

    .kd-info { width: 256px; display: flex; flex-direction: column; align-items: center; gap: 12px; }
    .kd-title { color: #F1F5F9; font-size: 24px; font-weight: 700; letter-spacing: .4em; text-shadow: 0 0 12px rgba(0,229,255,.6); }
    .kd-step { color: #94A3B8; font-size: 12px; text-transform: uppercase; letter-spacing: .25em; }
    .kd-track { width: 100%; height: 4px; border-radius: 999px; background: rgba(255,255,255,.08); overflow: hidden; }
    .kd-bar { height: 100%; width: 0; border-radius: 999px; background: linear-gradient(90deg, #00E5FF, #FBBF24);
      box-shadow: 0 0 10px #00E5FF; transition: width .2s ease; }
    .kd-pct { color: #94A3B8; font-size: 12px; font-family: ui-monospace, monospace; }

    @keyframes kd-scan { 0%,100% { top: 10%; opacity: .3 } 50% { top: 88%; opacity: 1 } }
    @keyframes kd-pulse { 0%,100% { opacity: .65 } 50% { opacity: 1 } }
    @keyframes kd-spin { to { transform: rotate(360deg) } }
  </style>
</head>
<body>

  <div id="loading-kodaff">
    <div class="kd-loader">
      <div class="kd-ring"></div>
      <div class="kd-ring-2"></div>
      <div class="kd-glow"></div>
      <div class="kd-finger">
        <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
          <path d="M12 10a2 2 0 0 0-2 2c0 1.02-.1 2.51-.26 4"/>
          <path d="M14 13.12c0 2.38 0 6.38-1 8.88"/>
          <path d="M17.29 21.02c.12-.6.43-2.3.5-3.02"/>
          <path d="M2 12a10 10 0 0 1 18-6"/>
          <path d="M2 16h.01"/>
          <path d="M21.8 16c.2-2 .131-5.354 0-6"/>
          <path d="M5 19.5C5.5 18 6 15 6 12a6 6 0 0 1 .34-2"/>
          <path d="M8.65 22c.21-.66.45-1.32.57-2"/>
          <path d="M9 6.8a6 6 0 0 1 9 5.2v2"/>
        </svg>
        <div class="kd-scan"></div>
      </div>
    </div>
    <div class="kd-info">
      <div class="kd-title">KODAFF</div>
      <div class="kd-step" id="kd-step">Inicializando…</div>
      <div class="kd-track"><div class="kd-bar" id="kd-bar"></div></div>
      <div class="kd-pct" id="kd-pct">0%</div>
    </div>
  </div>

  <script src="flutter_bootstrap.js" async></script>

  <script>
    (function () {
      var steps = ['Inicializando…', 'Verificando identidade…', 'Conectando ao mercado…', 'Quase pronto…'];
      var p = 0;
      var bar = document.getElementById('kd-bar');
      var pct = document.getElementById('kd-pct');
      var step = document.getElementById('kd-step');

      function render() {
        bar.style.width = p + '%';
        pct.textContent = Math.floor(p) + '%';
        step.textContent = p >= 100 ? 'Pronto' : steps[Math.min(3, Math.floor(p / 25))];
      }

      var timer = setInterval(function () {
        if (p < 90) { p += Math.max(0.3, (90 - p) * 0.03); render(); }
      }, 60);

      function esconder() {
        var el = document.getElementById('loading-kodaff');
        if (!el) return;
        clearInterval(timer);
        p = 100; render();
        setTimeout(function () {
          el.classList.add('ocultar');
          setTimeout(function () { el.remove(); }, 500);
        }, 300);
      }

      window.addEventListener('flutter-first-frame', esconder);
      setTimeout(esconder, 15000);
    })();
  </script>
</body>
</html>
